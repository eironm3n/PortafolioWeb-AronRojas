version: 2
updates:
  # Dependencias de npm (vue, gsap, vite, eslint...)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    groups:
      # Agrupa las actualizaciones menores/parches en un solo PR
      menores:
        update-types: ["minor", "patch"]

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
