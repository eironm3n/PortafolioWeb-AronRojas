    <!-- Datos estructurados para buscadores: quién es, qué hace y dónde encontrarlo. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Arón Rojas",
        "alternateName": "Carlos Arón Rojas",
        "jobTitle": "Especialista en Soporte de Aplicaciones",
        "description": "Soporte L1/L2 de aplicaciones de geociencia para el sector energético (YPF, PeCOM), con infraestructura en AWS y Azure y automatización con Python y PowerShell.",

        "address": { "@type": "PostalAddress", "addressLocality": "Mendoza", "addressCountry": "AR" },
        "worksFor": { "@type": "Organization", "name": "ReMASA" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "UTN Facultad Regional San Rafael" },

      }
    </script>
    <!-- Aplica el tema elegido antes del primer pintado, para que no destelle el otro (ver NavBar.vue). -->
    <script>
      try {
        const tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.tema = tema;
      } catch { /* sin acceso a localStorage: se usa el tema del sistema */ }
    </script>
    <!-- Inter para el texto y JetBrains Mono para fechas y metadatos. -->
