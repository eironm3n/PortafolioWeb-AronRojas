    <!-- Aplica el tema elegido antes del primer pintado, para que no destelle el otro (ver NavBar.vue). -->

      try {
        const tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.tema = tema;
      } catch { /* sin acceso a localStorage: se usa el tema del sistema */ }
    </script>
